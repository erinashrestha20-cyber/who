<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .body{
            background-color: wheat;
        }
        .circle{
            height: 80px;
            width: 80px;
            border: 1px solid black;
            border-radius: 50%;
            position: relative;
            animation: bounce 0.6s infinite ease-in-out, moveRight 4s linear infinite;
            background-color: red;
        }

        @keyframes bounce{
             0%, 100% {
            top: 0;
        }
        50% {
            top: 200px;
        }
    }
            

        @keyframes moveRight{
            from{
            left: 0;
        }
        to{
            left: 2000px;

        }
    }

    

    </style>
</head>
<body>
    <div class="circle"></div>
</body>
</html>
