<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num1 = Number(prompt("Enter a positive number:"));
        let num2 = Number(prompt("Enter a positive number:"));

        document.write("Number 1 = " + num1 + "<br>");
        document.write("Number 2 = " + num2 + "<br>");

        document.write("Addition = " + (num1 + num2) + "<br>");
        document.write("Subtraction = " + (num1 - num2) + "<br>");
        document.write("Multiplication = " + (num1 * num2) + "<br>");
        document.write("Division = " + (num1 / num2) + "<br>");
        document.write("Modulus = " + (num1 % num2) + "<br>");
    </script>
</body>
</html>
