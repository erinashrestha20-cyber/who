<!DOCTYPE html>
<html>
<head>
    <title>Exercise 8</title>
</head>
<body>

<h2>Numbers from 1 to 10</h2>

<p id="numbers"></p>

<h2>Even Numbers</h2>

<p id="even"></p>

<script>

let output = "";

for(let i=1;i<=10;i++){
    output += i + "<br>";
}

document.getElementById("numbers").innerHTML = output;

let even = "";

for(let i=1;i<=10;i++){
    if(i%2==0){
        even += i + "<br>";
    }
}

document.getElementById("even").innerHTML = even;

</script>

</body>
</html>
