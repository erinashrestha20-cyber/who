<!DOCTYPE html>
<html>
<head>
    <title>Exercise 11</title>
</head>
<body>

<h2>Fruits Array</h2>

<p id="fruits"></p>

<script>

let fruits = [
    "Apple",
    "Mango",
    "Banana",
    "Orange",
    "Grapes"
];

document.getElementById("fruits").innerHTML =
"First Fruit : " + fruits[0] + "<br>" +
"Last Fruit : " + fruits[fruits.length-1] + "<br>" +
"Total Number of Fruits : " + fruits.length;

</script>

</body>
</html>
