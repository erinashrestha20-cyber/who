<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Night Village</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#000;
}

/* ================= SCENE ================= */

.scene{
    width:1000px;
    height:650px;
    position:relative;
    overflow:hidden;
    background:radial-gradient(circle at center, #0b2a4a, #020611);
}

/* ================= MOON ================= */

.moon{
    width:90px;
    height:90px;
    background:#f5f5f5;
    border-radius:50%;
    position:absolute;
    top:70px;
    right:80px;
    box-shadow:0 0 40px #fff;
}

/* ================= STARS ================= */

.star{
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
    position:absolute;
    box-shadow:0 0 6px white;
}

/* Random star positions */
.star:nth-child(1){top:50px; left:100px;}
.star:nth-child(2){top:120px; left:200px;}
.star:nth-child(3){top:80px; left:400px;}
.star:nth-child(4){top:150px; left:600px;}
.star:nth-child(5){top:60px; left:800px;}
.star:nth-child(6){top:200px; left:300px;}
.star:nth-child(7){top:250px; left:700px;}
.star:nth-child(8){top:100px; left:900px;}
.star:nth-child(9){top:180px; left:500px;}
.star:nth-child(10){top:220px; left:150px;}

/* ================= BUSHES ================= */

.bush{
    position:absolute;
    bottom:150px;
    width:120px;
    height:60px;
    background:#0a3d1c;
    border-radius:50%;
}

/* .b1{ left:50px; }
.b2{ left:200px; }
.b3{ left:350px; }
.b4{ left:600px; }
.b5{ left:800px; } */

/* ================= GROUND ================= */

.ground{
    width:100%;
    height:150px;
    background:linear-gradient(#0d5c2a,#03210f);
    position:absolute;
    bottom:0;
}

/* ================= ROAD ================= */

.road{
    width:100%;
    height:100px;
    background:#111;
    position:absolute;
    bottom:0;
}

.line{
    width:80px;
    height:8px;
    background:#ccc;
    position:absolute;
    top:46px;
}

.line1{ left:50px;}
.line2{ left:200px;}
.line3{ left:350px;}
.line4{ left:500px;}
.line5{ left:650px;}
.line6{ left:800px;}

/* ================= HOUSE ================= */

.house{
    width:230px;
    height:180px;
    background:#d8c3a5;
    position:absolute;
    bottom:100px;
    left:380px;
    box-shadow:0 0 20px rgba(0,0,0,0.5);
}

/* ROOF */

.roof{
    width:0;
    height:0;
    border-left:130px solid transparent;
    border-right:130px solid transparent;
    border-bottom:90px solid #7a0c0c;
    position:absolute;
    bottom:180px;
    left:-15px;
}

/* CHIMNEY */

.chimney{
    width:35px;
    height:90px;
    background:#5A2D0C;
    position:absolute;
    bottom:180px;
    right:40px;
}

/* WINDOWS */

.window{
    width:60px;
    height:60px;
    background:#ffd966;
    border:4px solid #222;
    position:absolute;
    box-shadow:0 0 15px #ffd966;
}

.window1{ top:30px; left:25px;}
.window2{ top:30px; right:25px;}

/* DOOR */

.door{
    width:55px;
    height:90px;
    background:#5a2d0c;
    border:2px solid #222;
    position:absolute;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
}

</style>
</head>

<body>

<div class="scene">

    <!-- Moon -->
    <div class="moon"></div>

    <!-- Stars -->
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>



    <!-- Bushes -->
    <!-- <div class="bush b1"></div>
    <div class="bush b2"></div>
    <div class="bush b3"></div>
    <div class="bush b4"></div>
    <div class="bush b5"></div> -->

    <!-- Ground -->
    <div class="ground"></div>

    <!-- Road -->
    <div class="road">
        <div class="line line1"></div>
        <div class="line line2"></div>
        <div class="line line3"></div>
        <div class="line line4"></div>
        <div class="line line5"></div>
        <div class="line line6"></div>
    </div>

    <!-- House -->
    <div class="house">
        <div class="chimney"></div>
        <div class="roof"></div>
        <div class="window window1"></div>
        <div class="window window2"></div>
        <div class="door"></div>
    </div>

</div>

</body>
</html>
