<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>village</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #222;
        }

        .scene{
            width: 1000px;
            height: 650px;
            background: skyblue;
            position: relative;
            overflow: hidden;
        }
        .sun{
            width:80px;
            height:80px;
            background:#FFD43B;

            border-radius:50%;

            position:absolute;

            top:120px;
            right:80px;
        }
       

        .ground{
            width: 100%; /*tells grouond to take full width of the scene*/
            height: 150px;
            background: #5ea53c;
            position: absolute;
            bottom: 0;
            left: 0;
        }

        .road{
            width: 100%;
            height: 100px;
            background: #30343b;
            position: absolute;
            bottom: 0;
            left: 0;
        }
        
        .line{
            width:70px;
            height:10px;
            background:white;
            position:absolute;
            top:75px;
        }

        .line1{
            left:20px;
        }

        .line2{
            left:170px;
        }

        .line3{
            left:320px;
        }

        .line4{
            left:470px;
        }

        .line5{
            left:620px;
        }

        .chimney{
            width:35px;
            height: 90px;
            background: #8b3e2f;
            position: absolute;
            bottom: 180px;
            right: 35px;
        }
        .house{
            width:220px;
            height:180px;
            background:#6db7d6;

            position:absolute;

            bottom:100px;
            left:380px;
        }
        .roof{
            
            width:0;
            height:0;

            border-left:130px solid transparent;
            border-right:130px solid transparent;
            border-bottom:90px solid #d43d3d;

            position:absolute;
            bottom:180px;
            left:-20px;
        }
        .window{
            width:60px;
            height:60px;
            background:wheat;
            border:4px solid black;
            position:absolute;
        }

        .window1{
            top:30px;
            left:135px;
        }

        .window2{
            top:30px;
            left:25px;
        }

        .door{
            height: 90px;
            width: 50px;
            background: brown;
            border: 2px solid black;
            position: absolute;
            bottom: 0;
            left: 85px;
        }

        .tree1{
            position: absolute;
            left: 70px;
            bottom: 100px;
        }

        .tree-top{
            width:70px;
            height:70px;

            background:#4d8f2a;

            border-radius:50%;
        }

        .tree-trunk{

            width:18px;
            height:90px;

            background:#7b4a22;

            margin:auto;
        }

        .tree2{

            position:absolute;

            left:560px;
            bottom:100px;
        }
        .pine-top{

            width:0;
            height:0;

            border-left:55px solid transparent;
            border-right:55px solid transparent;

            border-bottom:135px solid #4d8f2a;
        }
        .pine-trunk{

            width:18px;
            height:70px;

            background:#7b4a22;

            margin:auto;
        }
    </style>
</head>
<body>
    <div class="scene">
            <div class="sun"></div>
            </div>
        <div class="ground"></div>
        <div class="road">
            <div class="line line1"></div>
            <div class="line line2"></div>
            <div class="line line3"></div>
            <div class="line line4"></div>
            <div class="line line5"></div>
        </div>
        <div class="house">
            <div class="chimney"></div>
            <div class="roof"></div>
            <div class="window window1"></div>
            <div class="window window2"></div>
            <div class="door"></div>
        </div>
        <div class="tree1">
            <div class="tree-top"></div>
            <div class="tree-trunk"></div>
        </div>
        <div class="tree2">
            <div class="pine-top"></div>
            <div class="pine-trunk"></div>
        </div>
    </div>
    
    
    
</body>
</html>
